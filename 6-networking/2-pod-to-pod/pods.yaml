apiVersion: apps/v1
kind: Deployment
metadata:
  name: net-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: net-deployment
  template:
    metadata:
      labels:
        app: net-deployment
    spec:
      containers:
      - name: netpod
        image: nicolaka/netshoot:v0.16
        command:
          - sleep
          - "3600"
